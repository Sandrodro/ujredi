services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ujredi
      POSTGRES_PASSWORD: ujredi
      POSTGRES_DB: ujredi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ujredi -d ujredi"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
